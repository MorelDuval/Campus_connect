<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Campus Connect</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Dashboard Container -->
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar admin-sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-shield-alt"></i>
                <h2>Admin Panel</h2>
            </div>
            
            <div class="sidebar-user-info">
                
                <div>
                    <span class="sidebar-user-name" id="sidebarUserName">Admin User</span>
                    <span class="sidebar-user-role">Administrator</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="overview">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-page="users">
                    <i class="fas fa-users-cog"></i>
                    <span>User Management</span>
                </a>
                <a href="#" class="nav-item" data-page="courses">
                    <i class="fas fa-book-open"></i>
                    <span>Course Management</span>
                </a>
                <a href="#" class="nav-item" data-page="departments">
                    <i class="fas fa-building"></i>
                    <span>Departments</span>
                </a>
                <a href="#" class="nav-item" data-page="payments">
                    <i class="fas fa-money-check-alt"></i>
                    <span>Fee Management</span>
                </a>
                <a href="#" class="nav-item" data-page="calendar">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Academic Calendar</span>
                </a>
                <a href="#" class="nav-item" data-page="reports">
                    <i class="fas fa-file-alt"></i>
                    <span>Reports</span>
                </a>
                <a href="#" class="nav-item" data-page="settings">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
                <a href="#" class="nav-item" data-page="logs">
                    <i class="fas fa-history"></i>
                    <span>Audit Logs</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar admin-top-bar">
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="Toggle menu" title="Toggle menu">
                </button>
                
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search anything...">
                </div>
                
                <div class="user-menu">
                    <div class="system-status">
                        <span class="status-dot online"></span>
                        System Online
                    </div>
                    <div class="notifications" onclick="toggleAdminNotifications()">
                        <i class="fas fa-bell"></i>
                        <span class="badge" id="adminNotificationBadge">0</span>
                    </div>
                    <div class="user-info">
                        
                        <span class="user-name" id="userName">Admin User</span>
                    </div>
                </div>
            </header>
            
            <!-- Page Content Area -->
            <div class="content-area" id="contentArea">
                <!-- Content loaded dynamically -->
            </div>
        </main>
    </div>
    
    <!-- Quick Action Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3 id="modalTitle">Modal Title</h3>
                <button class="close-modal" onclick="closeAdminModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Modal content loaded dynamically -->
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
