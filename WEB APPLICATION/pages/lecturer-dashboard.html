<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Dashboard - Campus Connect</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    
    <!-- Chart.js for reports -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Dashboard Container -->
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-chalkboard-teacher"></i>
                <h2>Campus Connect</h2>
            </div>
            
            <div class="sidebar-user-info">
               
                <div>
                    <span class="sidebar-user-name" id="sidebarUserName">Dr. Lecturer</span>
                    <span class="sidebar-user-role">Lecturer</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="overview">
                    <i class="fas fa-th-large"></i>
                    <span>Overview</span>
                </a>
                <a href="#" class="nav-item" data-page="courses">
                    <i class="fas fa-book"></i>
                    <span>My Courses</span>
                </a>
                <a href="#" class="nav-item" data-page="grades">
                    <i class="fas fa-star"></i>
                    <span>Grade Entry</span>
                </a>
                <a href="#" class="nav-item" data-page="attendance">
                    <i class="fas fa-clipboard-check"></i>
                    <span>Attendance</span>
                </a>
                <a href="#" class="nav-item" data-page="students">
                    <i class="fas fa-users"></i>
                    <span>Student List</span>
                </a>
                <a href="#" class="nav-item" data-page="announcements">
                    <i class="fas fa-bullhorn"></i>
                    <span>Announcements</span>
                </a>
                <a href="#" class="nav-item" data-page="materials">
                    <i class="fas fa-folder-open"></i>
                    <span>Materials</span>
                </a>
                <a href="#" class="nav-item" data-page="reports">
                    <i class="fas fa-chart-bar"></i>
                    <span>Reports</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="Toggle menu" title="Toggle menu">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
                
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search students, courses...">
                </div>
                
                <div class="user-menu">
                    <div class="notifications" onclick="toggleNotificationPanel()">
                        <i class="fas fa-bell"></i>
                        <span class="badge" id="notificationBadge">0</span>
                    </div>
                    <div class="user-info">
                        
                        <span class="user-name" id="userName">Dr. Lecturer</span>
                    </div>
                </div>
            </header>
            
            <!-- Page Content Area -->
            <div class="content-area" id="contentArea">
                <!-- Content loaded dynamically -->
            </div>
        </main>
    </div>
    
    <!-- Notification Panel -->
    <div class="notification-panel" id="notificationPanel">
        <div class="notification-panel-header">
            <h3>Notifications</h3>
            <button onclick="toggleNotificationPanel()">&times;</button>
        </div>
        <div class="notification-list" id="notificationList">
            <p class="text-muted">No new notifications</p>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/lecturer.js"></script>
</body>
</html>
