<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Connect - University Portal</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    
    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="background-animation">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Left Side - University Info -->
        <div class="info-panel">
            <div class="info-content">
                <div class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    <h1>Campus Connect</h1>
                </div>
                <p class="tagline">Digital University Management System</p>
                <div class="features">
                    <div class="feature-item">
                        <i class="fas fa-book"></i>
                        <span>Course Registration</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-calendar"></i>
                        <span>Smart Timetables</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-chart-line"></i>
                        <span>Grade Management</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-bell"></i>
                        <span>Instant Notifications</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Login Form -->
        <div class="login-panel">
            <div class="login-form-container">
                <h2>Welcome Back!</h2>
                <p class="subtitle">Sign in to access your portal</p>
                
                <!-- Login Form -->
                <form id="loginForm" class="login-form">
                    <!-- Role Selection -->
                    <div class="role-selector">
                        <label class="role-option">
                            <input type="radio" name="role" value="student" checked>
                            <span class="role-label">
                                <i class="fas fa-user-graduate"></i>
                                Student
                            </span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="lecturer">
                            <span class="role-label">
                                <i class="fas fa-chalkboard-teacher"></i>
                                Lecturer
                            </span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="admin">
                            <span class="role-label">
                                <i class="fas fa-user-shield"></i>
                                Admin
                            </span>
                        </label>
                    </div>

                    <!-- Email Input -->
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="University Email" required>
                    </div>

                    <!-- Password Input -->
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Password" required>
                        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                    </div>

                    <!-- Remember & Forgot -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="login-btn">
                        <span>Sign In</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <!-- Loading Spinner (Hidden by default) -->
                    <div class="loading-spinner" id="loadingSpinner">
                        <div class="spinner"></div>
                    </div>

                    <!-- Error Message -->
                    <div class="error-message" id="errorMessage"></div>
                </form>

                <!-- Registration Link -->
                <p class="register-link">
                    Don't have an account? 
                    <a href="#" id="showRegister">Contact Administrator</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Our JavaScript Files -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
